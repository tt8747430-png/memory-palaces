<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <!-- interactive-widget=resizes-visual: spec default, but load-bearing, not boilerplate.
       keyboard-viewport.ts measures --app-height − vv.height − offsetTop — valid only while the
       LAYOUT viewport holds. resizes-content shrinks both (Chrome 108+, FF 132+) → difference ~0
       → keyboard never detected → no --kb-inset, no scroll range, no reveal. WebKit implements
       none (webkit.org/b/259770), so this keeps iOS + Android on one path. Do not "modernise".
       ADR 0002.

       No maximum-scale, no user-scalable=no — not even for an installed app. Pinch-zoom is the
       only way some people read a screen, so removing it fails WCAG 2.2 §1.4.4, and it does not
       even buy what it used to: WebKit ignores the pair outright, so locking zoom took the
       gesture away on Android installs alone, which is the one place it was never needed. The
       measurement immunity it once paid for comes from sizing text-entry controls at 16px
       (--p-text-entry, theme.css) instead: below that, iOS zooms the visual viewport on focus and
       moves the ground under every measurement described above. -->
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
      name="viewport"
    />
    <!-- Matches --status-cap in each theme; the cap in RootLayout continues this colour downward. -->
    <meta content="#091A7A" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#0B1533" media="(prefers-color-scheme: dark)" name="theme-color" />
    <meta content="yes" name="mobile-web-app-capable" />
    <!-- Still the only spelling iOS honours, and black-translucent needs it. Pairs with
       viewport-fit=cover: the web view runs under the status bar, env(safe-area-inset-top) is
       then non-zero, and RootLayout's cap has something to fill. Under plain `black` that cap
       measured 0 and the app drew nothing there. -->
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="Mindscape" name="apple-mobile-web-app-title" />
    <meta
      content="Mindscape — Your Memory Palace. Train recall with the method of loci. Offline-first."
      name="description"
    />
    <title>Mindscape — Your Memory Palace</title>
    <script>
      ;(function () {
        /* Paints in the right theme. The preference itself lives in RxDB, which cannot be read
         before first paint, so ThemeProvider mirrors the resolved theme to localStorage on every
         change and this reads the mirror. Without it every launch painted light, then flipped. */
        try {
          var stored = localStorage.getItem('mindscape:theme')
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
