<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
      name="viewport"
    />
    <meta content="yes" name="mobile-web-app-capable" />
    <!-- Still the only spelling iOS honours. `black`: iOS paints the status bar from `theme-color`
       — the build writes one per OS scheme from `STATUS_BAR`, the header's chrome colour, and the
       script below repaints both for the learner's theme — and the web view runs from below the
       bar to the bottom of the screen. Under `black-translucent` WebKit sized that web view as if
       the bar were opaque and drew it under the bar, leaving a strip at the bottom (ADR 0007). -->
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black" name="apple-mobile-web-app-status-bar-style" />
    <meta content="Mindscape" name="apple-mobile-web-app-title" />
    <meta
      content="Mindscape — Your Memory Palace. Train recall with the method of loci. Offline-first."
      name="description"
    />
    <title>Mindscape — Your Memory Palace</title>
    <script id="boot-paint">
      ;(function () {
        // The theme the learner chose, which is 'light', 'dark' or 'system' — only the first two
        // answer for themselves. 'system', a device that has never stored one, and storage that
        // cannot be read ask the OS — each in its own guard, so one failing never skips the other.
        var theme = null
        try {
          var stored = localStorage.getItem('mindscape:theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (_) {}
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (_) {
            theme = 'light'
          }
        }
        document.documentElement.dataset.theme = theme

        // The status bar takes that theme's colour before first paint. Each theme-color meta names
        // one OS scheme; a theme the learner chose wins over the OS's, so every meta takes the
        // colour of the one that names it. useDeviceTheme keeps them once the app runs.
        var bars = document.querySelectorAll('meta[name="theme-color"]')
        var painted = document.querySelector(
          'meta[name="theme-color"][media="(prefers-color-scheme: ' + theme + ')"]',
        )
        if (painted) {
          for (var i = 0; i < bars.length; i++) {
            bars[i].setAttribute('content', painted.getAttribute('content'))
          }
        }

        // Damped motion, before the first transition can run. The OS answers, and so does the
        // learner's own switch on a device that has mirrored it. The attribute is written outside
        // both reads: the stylesheet damps on it alone, so an attribute that is merely absent is
        // an app that animates through a reduced-motion setting.
        var damped = false
        try {
          damped = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        } catch (_) {}
        try {
          damped = damped || localStorage.getItem('mindscape:reduced-motion') === 'on'
        } catch (_) {}
        document.documentElement.dataset.reducedMotion = damped ? 'reduce' : 'system'

        try {
          var installed =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.navigator.standalone === true
          if (installed) {
            document.querySelector('meta[name=viewport]').content =
              'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no,' +
              ' viewport-fit=cover, interactive-widget=resizes-visual'
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
