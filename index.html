<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
      name="viewport"
    />
    <!-- Android's bar: repainted by ThemeProvider (and by the script below, before first paint)
       from `--status-bar`, the token the header's chrome is painted with. iOS does not read it —
       see the style below. A media-matched pair would follow the OS instead of the theme the
       learner chose. -->
    <meta content="#2850b0" name="theme-color" />
    <meta content="yes" name="mobile-web-app-capable" />
    <!-- Still the only spelling iOS honours. `black-translucent`: the web view runs under the
       clock and the page paints what sits there — the header's chrome, the splash, a sheet's
       backdrop, a study session's scene (ADR 0006). Under `black` iOS painted the bar itself from
       the theme-color it read at load and never again, so nothing the app did reached it. The
       top inset iOS reports late is anchored (`--safe-top`, `top-inset.ts`), and the script below
       paints the first frame with the one remembered for this shape. -->
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="Mindscape" name="apple-mobile-web-app-title" />
    <meta
      content="Mindscape — Your Memory Palace. Train recall with the method of loci. Offline-first."
      name="description"
    />
    <title>Mindscape — Your Memory Palace</title>
    <script>
      ;(function () {
        // The theme the learner chose, which is 'light', 'dark' or 'system' — only the first two
        // answer for themselves; 'system', and a device that has never stored one, ask the OS.
        try {
          var stored = localStorage.getItem('mindscape:theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
          var bar = document.querySelector('meta[name="theme-color"]')
          if (bar) bar.setAttribute('content', resolved === 'dark' ? '#0b1533' : '#2850b0')
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }

        // Damped motion, before the first transition can run. The OS answers, and so does the
        // learner's own switch on a device that has mirrored it. The attribute is written outside
        // both reads: the stylesheet damps on it alone, so an attribute that is merely absent is
        // an app that animates through a reduced-motion setting.
        var damped = false
        try {
          damped = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        } catch (_) {}
        try {
          damped = damped || localStorage.getItem('mindscape:reduced-motion') === 'on'
        } catch (_) {}
        document.documentElement.dataset.reducedMotion = damped ? 'reduce' : 'system'

        var installed = false
        try {
          installed =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.navigator.standalone === true
          if (installed) {
            document.querySelector('meta[name=viewport]').content =
              'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no,' +
              ' viewport-fit=cover, interactive-widget=resizes-visual'
          }
        } catch (_) {}

        // The status bar's height as this shape last reported it, so the first frame is not drawn
        // under the clock while iOS has yet to report it. `top-inset.ts` keeps the same memory.
        try {
          var insets = JSON.parse(localStorage.getItem('mindscape:top-inset') || '{}')
          var top = insets[(installed ? 'app' : 'tab') + ':' + window.innerWidth]
          if (typeof top === 'number' && top > 0) {
            document.documentElement.style.setProperty('--safe-top-held', top + 'px')
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
